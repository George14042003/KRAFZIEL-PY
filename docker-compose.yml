name: elzuron

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local TURN/STUN relay (dev). Backend currently uses Cloudflare TURN; this is available if needed.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command: >
      -n --realm=elzuron --fingerprint --lt-cred-mech
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --listening-port=3478 --min-port=49160 --max-port=49200
      --no-cli --no-multicast-peers
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  pgdata:
